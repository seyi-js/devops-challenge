name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPO_NAME: devops-challenge

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build the Docker image, run tests, push to ECR
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (runs tests in builder stage)
        id: meta
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO_NAME: ${{ env.ECR_REPO_NAME }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${REPO_NAME}:${SHA}"
          docker build -t "${IMAGE}" app/
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Push to ECR (sha + latest tags)
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO_NAME: ${{ env.ECR_REPO_NAME }}
          SHA: ${{ github.sha }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker push "${IMAGE}"
          docker tag  "${IMAGE}" "${REGISTRY}/${REPO_NAME}:latest"
          docker push "${REGISTRY}/${REPO_NAME}:latest"

  # ─────────────────────────────────────────────────────────────
  # Job 2: Deploy to EC2 via AWS SSM Run Command (no open port 22)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          SHA: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          # Extract ECR registry host from the image URI
          ECR_HOST=$(echo "$IMAGE" | cut -d'/' -f1)

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${SHA:0:12}" \
            --parameters "commands=[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_HOST\",
              \"docker pull $IMAGE\",
              \"docker stop devops-app || true\",
              \"docker rm   devops-app || true\",
              \"docker run -d --name devops-app -p 3000:3000 --restart=unless-stopped -e NODE_ENV=production $IMAGE\",
              \"docker image prune -f\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll until command completes (timeout ~5 min)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i/30] Status: $STATUS"

            case "$STATUS" in
              Success)  echo "Deployment succeeded."; exit 0 ;;
              Failed|Cancelled|TimedOut|Undeliverable)
                        echo "Deployment failed with status: $STATUS"
                        aws ssm get-command-invocation \
                          --command-id "$COMMAND_ID" \
                          --instance-id "$INSTANCE_ID" \
                          --query 'StandardErrorContent' \
                          --output text
                        exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for SSM command."; exit 1

      - name: Verify application health
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["curl -sf http://localhost:3000/health"]' \
            --query 'Command.CommandId' \
            --output text)

          sleep 10

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text)

          echo "Health check status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1
